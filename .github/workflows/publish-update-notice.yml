# 새 버전 알림: main에 새 배포 파일을 올리면
#  1) 같은 버전의 GitHub 릴리스(v<버전>, 안드로이드는 android-v<버전>)를 만들고 파일을 붙이고
#  2) Supabase app_releases 테이블에 버전/주소/sha256을 기록해요.
# 앱은 켤 때 이 테이블을 읽고, 지금 버전보다 높으면 "새로운 버전이 출시되었어요" 알림을 띄워요.
#
# 필요한 저장소 Secret (Settings → Secrets and variables → Actions):
#   SUPABASE_SERVICE_ROLE_KEY  Supabase 대시보드 → Project Settings → API Keys → service_role (secret)
# 선택 Variable:
#   SUPABASE_URL               기본값 https://xwclrqtyynhkziwpwvyq.supabase.co
#
# 파일 이름 규칙: SenseChalk-<버전>-win-x64.zip, SenseChalk-Android-<버전>.apk
# 수동 실행(Actions → Publish update notice → Run workflow)으로 지금 main의 파일을 다시 기록할 수도 있어요.
name: Publish update notice

on:
  push:
    branches: [main]
    paths:
      - 'SenseChalk-*-win-x64.zip'
      - 'SenseChalk-Android-*.apk'
  workflow_dispatch:
    inputs:
      message:
        description: '알림 문구 (비우면 기본 문구)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: publish-update-notice
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Release and record
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://xwclrqtyynhkziwpwvyq.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTICE_MESSAGE: ${{ github.event.inputs.message || '' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: bash .github/scripts/publish-update-notice.sh
