# 새 버전 알림: main에 새 배포 파일을 올리면
#  1) 같은 버전의 GitHub 릴리스(v<버전>)를 만들고 파일을 붙이고
#  2) Supabase app_releases 테이블에 버전/주소/sha256을 기록해요.
# 앱은 켤 때 이 테이블을 읽고, 지금 버전보다 높으면 "새로운 버전이 출시되었어요" 알림을 띄워요.
#
# 필요한 저장소 Secret (Settings → Secrets and variables → Actions):
#   SUPABASE_SERVICE_ROLE_KEY  Supabase 대시보드 → Project Settings → API Keys → Secret key (sb_secret_...)
#                              또는 Legacy API Keys 탭의 service_role 키
#   UPDATE_SIGNING_KEY         업데이트 서명 개인키 (PEM 전체, -----BEGIN EC PRIVATE KEY----- 부터 끝 줄까지)
#                              PC 0.5.3.7부터 앱은 이 키로 서명된 zip만 설치해요. 공개키는 앱 안(UpdateSignature.cs)에 있어요.
# 선택 Variable:
#   SUPABASE_URL               기본값 https://xwclrqtyynhkziwpwvyq.supabase.co
#
# 배포 방법 (2026-11-21부터): 파일 이름은 항상 SenseChalk.zip 하나로 두고 덮어써요. 버전은 version.txt 한 줄(예: 5.4.3).
#   홈페이지 링크는 바뀌지 않아요: https://github.com/Osense/Sense_chalk_release/releases/latest/download/SenseChalk.zip
#   (예전 방식 SenseChalk-<버전>-win-x64.zip도 SenseChalk.zip이 없을 때만 계속 인식해요.)
# 설치 버전: SenseChalkSetup.exe도 같은 릴리스에 붙어요 (홈페이지 링크 .../releases/latest/download/SenseChalkSetup.exe).
#   앱 안 업데이트는 두 버전 모두 SenseChalk.zip을 받아요.
# 바뀐 내용(팝업 문구): notes/SenseChalk.md (예전 방식은 notes/SenseChalk-<버전>-win-x64.md)
#   첫 줄을 "# 제목"으로 쓰면 팝업 제목, 나머지가 팝업 본문이 돼요. 파일이 없으면 기본 문구를 써요.
#   노트만 고쳐서 올려도 알림 문구가 다시 기록돼요.
# 수동 실행(Actions → Publish update notice → Run workflow)으로 지금 main의 파일을 다시 기록할 수도 있어요.
name: Publish update notice

on:
  push:
    branches: [main]
    paths:
      - 'SenseChalk.zip'
      - 'SenseChalkSetup.exe'
      - 'version.txt'
      - 'SenseChalk-*-win-x64.zip'
      - 'notes/*.md'
      - '.github/workflows/publish-update-notice.yml'
      - '.github/scripts/publish-update-notice.sh'
  workflow_dispatch:
    inputs:
      message:
        description: '알림 문구 (비우면 기본 문구)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: publish-update-notice
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Release and record
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://xwclrqtyynhkziwpwvyq.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          NOTICE_MESSAGE: ${{ github.event.inputs.message || '' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: bash .github/scripts/publish-update-notice.sh
